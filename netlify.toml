[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Allow public API keys to appear in the build output.
  # These keys are designed to be public and are secured by their respective services:
  # - VITE_SUPABASE_ANON_KEY: Protected by Supabase Row Level Security
  # - VITE_SUPABASE_URL: Public Supabase project URL
  # - VITE_GOOGLE_MAPS_API_KEY: Restricted by HTTP referrer in Google Cloud Console
  # - google_maps_id, google_maps_javascript_api: Google Maps public configuration
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_URL,VITE_GOOGLE_MAPS_API_KEY,google_maps_id,google_maps_javascript_api"
  # Disable smart detection to prevent false positives on Google Maps API key
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
